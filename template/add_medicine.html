{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Medicine - Take Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar tc-navbar">
        <div class="container">
            <span class="navbar-brand mb-0">💊 Take Care</span>
        </div>
    </nav>

    <main class="container pb-5" style="max-width: 700px;">
        <h1 class="tc-page-title">Add Medicine</h1>

        <form id="medicine-form">
            {% csrf_token %}

            <div class="mb-4">
                <label for="name" class="form-label fs-5 fw-bold">Medicine name</label>
                <input type="text" id="name" class="form-control form-control-lg" required>
            </div>

            <div class="mb-4">
                <label for="dosage" class="form-label fs-5 fw-bold">Dosage</label>
                <input type="text" id="dosage" class="form-control form-control-lg" placeholder="e.g. 1 tablet" required>
            </div>

            <div class="mb-4">
                <label for="photo" class="form-label fs-5 fw-bold">Pill photo</label>
                <input type="file" id="photo" class="form-control form-control-lg" accept="image/*">
            </div>

            <div class="mb-4">
                <label class="form-label fs-5 fw-bold">Reminder times</label>
                <div id="times-list"></div>
                <button type="button" id="add-time-btn" class="btn btn-outline-secondary tc-btn w-100 mt-2">
                    + Add another time
                </button>
            </div>

            <div id="message" class="mb-3"></div>

            <button type="submit" id="save-btn" class="btn tc-btn tc-btn-taken w-100">Save medicine</button>
        </form>
    </main>

    <script>
        function getCsrfToken() {
            return document.querySelector('[name=csrfmiddlewaretoken]').value;
        }

        function showMessage(text, kind) {
            const box = document.getElementById('message');
            box.className = 'alert alert-' + kind;
            box.textContent = text;
        }

        /* ---------- Reminder time rows ---------- */
        function addTimeRow(removable) {
            const row = document.createElement('div');
            row.className = 'd-flex gap-2 mb-2';

            const input = document.createElement('input');
            input.type = 'time';
            input.className = 'form-control form-control-lg time-input';
            row.appendChild(input);

            if (removable) {
                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'btn btn-outline-danger tc-btn';
                removeBtn.textContent = '✕';
                removeBtn.setAttribute('aria-label', 'Remove this time');
                removeBtn.addEventListener('click', () => row.remove());
                row.appendChild(removeBtn);
            }

            document.getElementById('times-list').appendChild(row);
        }

        addTimeRow(false);   // first row, always there
        document.getElementById('add-time-btn').addEventListener('click', () => addTimeRow(true));

        /* ---------- Saving ---------- */
        document.getElementById('medicine-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const times = [...document.querySelectorAll('.time-input')]
                .map(input => input.value)
                .filter(value => value !== '');

            if (times.length === 0) {
                showMessage('Please add at least one reminder time.', 'warning');
                return;
            }

            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;

            // Request 1: save the medicine (and photo)
            const formData = new FormData();
            formData.append('name', document.getElementById('name').value.trim());
            formData.append('dosage', document.getElementById('dosage').value.trim());
            const photo = document.getElementById('photo').files[0];
            if (photo) {
                formData.append('photo', photo);
            }

            try {
                const response = await fetch('/api/medicines/', {
                    method: 'POST',
                    headers: { 'X-CSRFToken': getCsrfToken() },
                    credentials: 'same-origin',
                    body: formData
                });

                if (!response.ok) {
                    showMessage('Could not save. Please check the fields and try again.', 'danger');
                    saveBtn.disabled = false;
                    return;
                }

                const medicine = await response.json();

                // Request 2: save each reminder time using the new medicine id
                let failed = 0;
                for (const time of times) {
                    const timeResponse = await fetch(`/api/medicines/${medicine.id}/reminders/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCsrfToken()
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({ time: time })
                    });
                    if (!timeResponse.ok) {
                        failed += 1;
                    }
                }

                if (failed > 0) {
                    showMessage('Medicine saved, but ' + failed + ' time(s) could not be saved.', 'warning');
                    saveBtn.disabled = false;
                } else {
                    showMessage('Saved! Going back to your dashboard...', 'success');
                    setTimeout(() => { window.location.href = '/'; }, 1200);
                }
            } catch (err) {
                showMessage('Something went wrong. Please try again.', 'danger');
                saveBtn.disabled = false;
                console.error(err);
            }
        });
    </script>
</body>
</html>
