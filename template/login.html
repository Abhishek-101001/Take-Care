{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - Take Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar tc-navbar">
        <div class="container">
            <span class="navbar-brand mb-0">💊 Take Care</span>
        </div>
    </nav>

    <main class="container pb-5" style="max-width: 500px;">
        <h1 class="tc-page-title">Welcome</h1>
        <p class="mb-4">Please log in to see your medicines.</p>

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            {% if form.errors %}
                <div class="alert alert-danger">
                    Wrong username or password. Please try again.
                </div>
            {% endif %}

            <div class="mb-4">
                <label for="username" class="form-label fs-5 fw-bold">Username</label>
                <input type="text" id="username" name="username"
                       class="form-control form-control-lg"
                       autocomplete="username" autofocus required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fs-5 fw-bold">Password</label>
                <input type="password" id="password" name="password"
                       class="form-control form-control-lg"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn tc-btn tc-btn-taken w-100">Log in</button>
        </form>
    </main>
</body>
</html>
