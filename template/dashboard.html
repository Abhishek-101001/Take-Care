{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Take Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    {% csrf_token %}

    <nav class="navbar tc-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0">💊 Take Care</span>
            <form method="post" action="{% url 'logout' %}" class="m-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light">Log out</button>
            </form>
        </div>
    </nav>

    <main class="container pb-5">
        <h1 class="tc-page-title">Today's Doses</h1>
        <div id="dose-list">Loading today's doses...</div>

        <h2 class="tc-page-title">Your Medicines</h2>
        <div id="medicine-list">Loading your medicines...</div>
    </main>

    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getCsrfToken() {
            return document.querySelector('[name=csrfmiddlewaretoken]').value;
        }

        function speakReminder(name, dosage) {
            const message = `It's time to take ${name}, ${dosage}`;
            const utterance = new SpeechSynthesisUtterance(message);
            utterance.rate = 0.9;
            speechSynthesis.speak(utterance);
        }

        function photoHtml(url, name) {
            return url ? `<img src="${url}" alt="Photo of ${escapeHtml(name)}">` : '';
        }

        /* ---------- Today's doses ---------- */
        const STATUS_LABELS = { pending: 'Pending', taken: 'Taken ✔', missed: 'Missed' };

        async function loadDoses() {
            const container = document.getElementById('dose-list');
            try {
                const response = await fetch('/api/doses/', {
                    headers: { 'Accept': 'application/json' },
                    credentials: 'same-origin'
                });
                const doses = await response.json();
                container.innerHTML = '';

                if (doses.length === 0) {
                    container.innerHTML = '<p>No doses scheduled for today.</p>';
                    return;
                }

                doses.forEach(dose => {
                    const time = new Date(dose.scheduled_for)
                        .toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

                    const card = document.createElement('div');
                    card.className = 'medicine-card';
                    card.innerHTML = `
                        ${photoHtml(dose.medicine_photo, dose.medicine_name)}
                        <div class="medicine-info">
                            <div class="medicine-name">${escapeHtml(dose.medicine_name)} - ${escapeHtml(dose.medicine_dosage)}</div>
                            <div class="reminder-time">⏰ ${time}</div>
                        </div>
                        <div class="dose-actions">
                            <span class="status-badge status-${dose.status}">${STATUS_LABELS[dose.status]}</span>
                        </div>
                    `;

                    // Only pending doses get buttons
                    if (dose.status === 'pending') {
                        const actions = card.querySelector('.dose-actions');

                        const hearBtn = document.createElement('button');
                        hearBtn.className = 'btn tc-btn tc-btn-green';
                        hearBtn.textContent = '🔊 Hear reminder';
                        hearBtn.addEventListener('click', () =>
                            speakReminder(dose.medicine_name, dose.medicine_dosage));
                        actions.appendChild(hearBtn);

                        const takenBtn = document.createElement('button');
                        takenBtn.className = 'btn tc-btn tc-btn-taken';
                        takenBtn.textContent = '✔ I took it';
                        takenBtn.addEventListener('click', () => markTaken(dose.id));
                        actions.appendChild(takenBtn);
                    }

                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = '<p>Sorry, could not load today\'s doses. Please refresh.</p>';
                console.error(err);
            }
        }

        async function markTaken(doseId) {
            const response = await fetch(`/api/doses/${doseId}/taken/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': getCsrfToken() },
                credentials: 'same-origin'
            });
            if (response.ok) {
                loadDoses();
            } else {
                alert('Something went wrong. Please try again.');
            }
        }

        /* ---------- Medicines ---------- */
        async function loadMedicines() {
            const container = document.getElementById('medicine-list');
            try {
                const response = await fetch('/api/medicines/', {
                    headers: { 'Accept': 'application/json' },
                    credentials: 'same-origin'
                });
                const medicines = await response.json();
                container.innerHTML = '';

                if (medicines.length === 0) {
                    container.innerHTML = '<p>No medicines added yet.</p>';
                    return;
                }

                medicines.forEach(med => {
                    const times = med.reminders.map(r => r.time).join(', ');
                    const card = document.createElement('div');
                    card.className = 'medicine-card';
                    card.innerHTML = `
                        ${photoHtml(med.photo, med.name)}
                        <div class="medicine-info">
                            <div class="medicine-name">${escapeHtml(med.name)} - ${escapeHtml(med.dosage)}</div>
                            <div class="reminder-time">Times: ${escapeHtml(times)}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = '<p>Sorry, could not load your medicines. Please refresh.</p>';
                console.error(err);
            }
        }

        loadDoses();
        loadMedicines();
    </script>
</body>
</html>
