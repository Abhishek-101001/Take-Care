{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caregiver - Take Care</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar tc-navbar">
        <div class="container">
            <span class="navbar-brand mb-0">💊 Take Care</span>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
            </form>
        </div>
    </nav>

    <main class="container pb-5">
        <h1 class="tc-page-title">Hello, {{ request.user.first_name|default:request.user.username }}</h1>
        <h2 class="h4 mt-4">Your parents</h2>
        <p>No parents added yet. You will be able to add them here soon.</p>
    </main>
</body>
</html>
